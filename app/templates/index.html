<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Sales Data Ingestion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="card-title text-primary fw-bold mb-3">Sales Ingestion & Analytics Portal</h2>
                        <p class="text-muted">Upload sales CSV files to trigger real-time Operational ETL (PostgreSQL) and Analytics Pipelines (Snowflake Medallion).</p>

                        {% if message %}
                            <div class="alert alert-{{ alert_type }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endif %}

                        <form action="/upload" method="POST" enctype="multipart/form-data" class="mt-4">
                            <div class="mb-3">
                                <label for="file" class="form-label fw-semibold">Select Sales CSV/Excel File</label>
                                <input class="form-type form-control" type="file" id="file" name="file" accept=".csv" required>
                            </div>
                            <button type="submit" class="btn btn-primary px-4 py-2">Upload & Trigger Pipeline</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
